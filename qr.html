
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growvia QR Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#202b3c;font-family:Arial,sans-serif}
header{background:#17243a;color:white;padding:20px 6%;display:flex;justify-content:space-between}
header b{color:#e5bd75;font-size:22px}
header a{color:white;text-decoration:none}
main{max-width:750px;margin:35px auto;padding:15px}
.card{background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #17243a12}
h1{margin-top:0}
p{color:#687386;line-height:1.6}
select{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;margin:12px 0 20px;font-size:16px}
.status{padding:13px;background:#fff4e5;color:#80551b;border-radius:8px;margin-top:15px}
.success{background:#e9f8ef;color:#17633b}
.qrbox{text-align:center;background:#faf8f3;padding:25px;border-radius:14px;margin-top:20px}
#qrImage{width:260px;max-width:100%;height:auto;background:white;padding:8px}
.link{overflow-wrap:anywhere;background:#f1f3f7;padding:12px;border-radius:8px;font-size:14px}
button{border:0;border-radius:9px;padding:14px 18px;background:#74344e;color:white;font-weight:bold;cursor:pointer;margin:8px 4px}
@media(max-width:600px){main{margin:15px auto}.card{padding:20px}}
</style>
</head>
<body>

<header>
<b>GROWVIA</b>
<a href="dashboard.html">← Dashboard</a>
</header>

<main>
<div class="card">
<h1>QR Code Generator</h1>
<p>अपना Business चुनें और Review Page का QR Code बनाएँ।</p>

<select id="businessSelect">
<option value="">Loading Businesses...</option>
</select>

<div id="status" class="status">Loading...</div>

<div id="qrSection" style="display:none">
<div class="qrbox">
<h3 id="businessName"></h3>
<img id="qrImage" alt="Business Review QR Code">
<p>Scan करके अपना Feedback दें</p>
</div>

<h3>Review Page Link</h3>
<div class="link" id="pageLink"></div>

<div style="text-align:center;margin-top:15px">
<button id="downloadBtn">Download QR PNG</button>
<button id="openBtn">Open Review Page</button>
</div>
</div>
</div>
</main>

<script>
const SUPABASE_URL="https://zfnvxfztxhzxwwvkapys.supabase.co";
const SUPABASE_KEY="sb_publishable_X_Li2kPRPtqU7MeLqOSUpg_iCGLLpi1";

const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const businessSelect=document.getElementById("businessSelect");
const statusBox=document.getElementById("status");
const qrSection=document.getElementById("qrSection");
const qrImage=document.getElementById("qrImage");

let currentUrl="";
let qrImageUrl="";

function showStatus(message,success=false){
 statusBox.textContent=message;
 statusBox.className=success?"status success":"status";
}

async function loadBusinesses(){
 try{
  const {data:{user},error:authError}=await client.auth.getUser();
  if(authError||!user){
   showStatus("पहले Dashboard में Login करें।");
   return;
  }

  const {data,error}=await client
   .from("businesses")
   .select("id,business_name")
   .eq("owner_user_id",user.id)
   .order("created_at",{ascending:false});

  if(error)throw error;

  businessSelect.innerHTML='<option value="">Select Business</option>';

  if(!data||data.length===0){
   showStatus("कोई Business नहीं मिला।");
   return;
  }

  data.forEach(b=>{
   const option=document.createElement("option");
   option.value=b.id;
   option.textContent=b.business_name;
   businessSelect.appendChild(option);
  });

  showStatus("Business चुनें।",true);

 }catch(e){
  showStatus("Error: "+e.message);
 }
}

async function generateQR(){
 qrSection.style.display="none";
 currentUrl="";
 qrImageUrl="";

 const businessId=businessSelect.value;
 if(!businessId)return;

 showStatus("Review Page खोज रहे हैं...");

 try{
  const {data:page,error}=await client
   .from("review_pages")
   .select("slug,is_published")
   .eq("business_id",businessId)
   .maybeSingle();

  if(error)throw error;

  if(!page||!page.slug){
   showStatus("पहले Dashboard में Review Page Settings Save करें।");
   return;
  }

  if(!page.is_published){
   showStatus("पहले Dashboard में Review Page Publish करें।");
   return;
  }

  const businessName=businessSelect.options[businessSelect.selectedIndex].text;

  currentUrl=new URL("review.html",location.href).href+
   "?slug="+encodeURIComponent(page.slug);

  qrImageUrl="https://api.qrserver.com/v1/create-qr-code/?size=500x500&format=png&data="+encodeURIComponent(currentUrl);

  qrImage.onload=()=>{
   document.getElementById("businessName").textContent=businessName;
   document.getElementById("pageLink").textContent=currentUrl;
   qrSection.style.display="block";
   showStatus("QR Code तैयार है!",true);
  };

  qrImage.onerror=()=>{
   showStatus("QR Image सेवा उपलब्ध नहीं है। कृपया दोबारा कोशिश करें।");
  };

  qrImage.src=qrImageUrl;

 }catch(e){
  showStatus("Error: "+e.message);
 }
}

businessSelect.addEventListener("change",generateQR);

document.getElementById("downloadBtn").addEventListener("click",async()=>{
 if(!qrImageUrl)return;

 try{
  const response=await fetch(qrImageUrl);
  if(!response.ok)throw new Error("Download failed");

  const blob=await response.blob();
  const blobUrl=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=blobUrl;
  a.download="Growvia-Review-QR.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl),2000);

 }catch(e){
  window.open(qrImageUrl,"_blank");
  showStatus("QR Image नए टैब में खुल गई है। वहाँ से Save Image करें।");
 }
});

document.getElementById("openBtn").addEventListener("click",()=>{
 if(currentUrl)window.open(currentUrl,"_blank");
});

loadBusinesses();
</script>
</body>
</html>
